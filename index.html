<script>
const $=id=>document.getElementById(id),K='dx2',p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const C={F:['🍽️','Food'],T:['🚗','Transport'],S:['🥤','Snacks'],B:['🛒','Shopping'],O:['📦','Other']};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const lab=k=>new Date(k+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dm=k=>k.split('-').reverse().join('-');
const copts=s=>Object.entries(C).map(([k,v])=>`<option value="${k}"${k==s?' selected':''}>${v[0]}</option>`).join('');
function load(){
 try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.days)return s}catch(e){}
 const s={days:{},defs:[{n:'Car Rent',a:40,c:'T'},{n:'Nasta',a:100,c:'F'},{n:'Car Rent',a:20,c:'T'}],bd:0,bm:0,theme:''};
 try{const o=JSON.parse(localStorage.getItem('expenseData'));if(o&&o.items)s.days[iso(new Date())]={items:(()=>{const d=s.defs.map(x=>({...x,d:1})),u=o.items.filter(i=>!i.default).map(i=>({n:i.name,a:+i.amount||0,c:'O'}));return d.slice(0,1).concat(u,d.slice(1))})(),sh:+o.shanto||0,p:+o.previous||0}}catch(e){}
 return s}
let S=load(),cur=iso(new Date()),mo=cur.slice(0,7),view='today',tm;
const minD=()=>{const l=new Date();l.setDate(l.getDate()-30);return iso(l)};
function prune(){const L=minD(),old=Object.keys(S.days).sort().filter(k=>k<L);if(!old.length)return;S.base=bal(old[old.length-1]);old.forEach(k=>delete S.days[k])}
const save=()=>{prune();localStorage.setItem(K,JSON.stringify(S))};
const day=d=>S.days[d]||{items:isOff(d)?[]:S.defs.map(x=>({...x,d:1})),sh:0,p:null};
function edit(){if(!S.days[cur])S.days[cur]=day(cur);return S.days[cur]}
function ins(it){const L=edit().items;let seen=0,pos=L.length;for(let i=0;i<L.length;i++){if(L[i].d&&++seen==2){pos=i;break}}L.splice(pos,0,it)}
const sum=d=>d.items.reduce((t,i)=>t+(+i.a||0),0);
function prevOf(d){const x=S.days[d];if(x&&x.p!=null)return x.p;const ks=Object.keys(S.days).filter(k=>k<d).sort();return ks.length?bal(ks.pop()):(S.base||0)}
function bal(d){const x=day(d);return sum(x)+prevOf(d)+(+x.sh||0)}
function known(){const m={};Object.keys(S.days).sort().forEach(k=>S.days[k].items.forEach(i=>m[i.n.toLowerCase()]={n:i.n,a:i.a,c:i.c}));S.defs.forEach(i=>m[i.n.toLowerCase()]=m[i.n.toLowerCase()]||{...i});return m}
function toast(msg,undo){const t=$('tt');t.innerHTML=esc(msg)+(undo?'<button id="ud">Undo</button>':'');t.style.display='flex';if(undo)$('ud').onclick=()=>{undo();t.style.display='none'};clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',4000)}
function theme(){const d=document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');$('thc').checked=d=='dark'}
$('thc').onchange=()=>{S.theme=$('thc').checked?'dark':'light';save();theme()};

function upd(){const x=day(cur),t=sum(x),b=bal(cur);
 $('bal').textContent='৳ '+fmt(b);$('tot').textContent=fmt(t);$('cnt').textContent=x.items.length+' items';$('hbi').style.width=Math.min(100,S.bd>0?t/S.bd*100:(b>0?t/b*100:0))+'%';
 const man=!!(S.days[cur]&&S.days[cur].p!=null);$('pa').hidden=!man;$('pl').textContent=man?'Previous · Manual':'Previous ✎';

const row=x=>`<div class="tr" data-edit="${x.id}"><span class="em">${em(x.c)}</span><div style="flex:1;min-width:0"><b>${esc(x.n||x.c)}</b><br><small>${esc(x.c)} · ${x.d.slice(8)}/${x.d.slice(5,7)}</small></div><b class="${x.t=='i'?'gn':'rd'}">${x.t=='i'?'+':'−'}৳${fmt(x.a)}</b></div>`;
const list=f=>((X.m[mm]||{tx:[]}).tx).filter(f).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
function ov(){applyRec(mm);const inc=tot(mm,'i'),exp=tot(mm,'e'),op=openOf(mm),bal=op+inc-exp,m=X.m[mm]||{},av=op+inc;let w='';
 Object.entries(X.cl).forEach(([c,l])=>{const s=spent(mm,c);if(s>=l)w+=`<div class="card warn">${esc(c)}: ৳${fmt(s)} / ৳${fmt(l)} – limit reached</div>`;else if(s>=l*.8)w+=`<div class="card warn am">${esc(c)}: 80% of limit used</div>`});
 const pb=(l,v,t,o)=>t>0?`<div class="card ${o?'warn':''}"><div class="ch"><b>${l}</b><span>৳${fmt(v)} / ৳${fmt(t)}</span></div><div class="bar ${o?'over':''}"><i style="width:${Math.min(100,v/t*100)}%"></i></div></div>`:'';
 const rc=list(()=>1);
 return `<div class="hero"><small>Monthly balance</small><div class="big${bal<0?' neg':''}">৳ ${fmt(bal)}</div><div class="hbar"><i style="width:${X.bud>0?Math.min(100,exp/X.bud*100):(av>0?Math.min(100,exp/av*100):0)}%"></i></div><div class="trio"><div><small>Opening ✎</small><input id="zop" inputmode="decimal" value="${m.open==null?'':m.open}" placeholder="${fmt(op)}"></div><div><small>Income</small><b>+${fmt(inc)}</b></div><div><small>● Spent</small><b>−${fmt(exp)}</b></div></div></div>
 <div class="g2" style="margin:0 0 12px"><button class="pb" data-m="add" style="padding:13px">+ Add expense</button><button data-m="inc" style="padding:13px;background:var(--cd);box-shadow:var(--sh);font-weight:600">+ Add income</button></div>${w}${pb('Monthly budget',exp,X.bud,exp>X.bud)}${pb('Savings goal',Math.max(0,inc-exp),X.goal,0)}
 <h2>Recent</h2><div class="card">${rc.slice(0,8).map(row).join('')||'<p class="mu c">No entries yet. Tap + Add expense.</p>'}${rc.length>8?'<button data-m="tab" data-t="en" style="width:100%;margin-top:8px">View all</button>':''}</div>`}
function en(){return `<div class="g2" style="grid-template-columns:2fr 1fr;margin:0 0 8px"><input id="zhq" placeholder="Search entries" value="${esc(hq)}"><select id="zhc"><option value="">All</option>${X.cats.concat(X.inc).map(c=>`<option ${c==hc?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="card" id="zhl"></div>`}
const hl=()=>{$('zhl').innerHTML=list(x=>(!hc||x.c==hc)&&(!hq||(x.n+x.c).toLowerCase().includes(hq))).map(row).join('')||'<p class="mu c">Nothing found.</p>'};
function su(){const m=X.m[mm]||{tx:[]},inc=tot(mm,'i'),exp=tot(mm,'e'),[y,q]=mm.split('-').map(Number),nd=new Date(y,q,0).getDate(),dd={},bc={},ic={};
 m.tx.forEach(x=>{if(x.t=='e'){dd[x.d]=(dd[x.d]||0)+x.a;bc[x.c]=(bc[x.c]||0)+x.a}else ic[x.c]=(ic[x.c]||0)+x.a});
 const dk=Object.keys(dd),top=dk.slice().sort((a,b)=>dd[b]-dd[a])[0],mx=Math.max(1,...Object.values(dd));let bars='';
 for(let d=1;d<=nd;d++){const v=dd[mm+'-'+p2(d)]||0;bars+=`<i title="${d}: ${fmt(v)}" style="height:${v/mx*100}%"></i>`}
 const rows=(o,t,lim)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const l=lim&&X.cl[c];return`<div class="cr"><span>${em(c)} ${esc(c)}</span><div class="bar${l&&v>l?' over':''}"><i style="width:${l?Math.min(100,v/l*100):v/Math.max(1,t)*100}%"></i></div><span>${fmt(v)}</span></div>`}).join('')||'<p class="mu">No data this month.</p>';
 return `<div class="card"><div class="st"><div><small>Total spent</small><b>৳ ${fmt(exp)}</b></div><div><small>Total income</small><b>৳ ${fmt(inc)}</b></div><div><small>Avg per day</small><b>৳ ${fmt(dk.length?exp/dk.length:0)}</b></div><div><small>Highest day</small><b>${top?'৳ '+fmt(dd[top]):'-'}</b>${top?'<small>'+(+top.slice(8))+' '+new Date(top+'T00:00').toLocaleDateString('en-GB',{month:'short'})+'</small>':''}</div></div></div>
 <div class="card"><b>Daily spending</b><div class="days" style="margin-top:10px">${bars}</div></div><div class="card"><b>By category</b><br><small>Bar shows progress to the limit when one is set</small>${rows(bc,exp,1)}</div><div class="card"><b>Income sources</b>${rows(ic,inc)}</div>`}
function se(){const m=X.m[mm]||{},lst=(a,k)=>a.map((c,i)=>`<div class="zd"><span>${em(c)} ${esc(c)}</span><button class="x" data-m="dc" data-key="${k}" data-i="${i}">×</button></div>`).join('');
 return `<div class="card"><b>Opening balance (this month)</b><br><small>Leave empty to carry over last month's balance (now ৳${fmt(openOf(mm))})</small><input data-k="open" inputmode="decimal" style="width:100%;margin-top:8px" value="${m.open==null?'':m.open}" placeholder="Money you had at the start"></div>
 <div class="card"><b>Budget &amp; goal</b><div class="g2"><div><small>Monthly budget (৳)</small><input style="width:100%" data-k="bud" inputmode="decimal" value="${X.bud||''}" placeholder="No limit"></div><div><small>Savings goal (৳)</small><input style="width:100%" data-k="goal" inputmode="decimal" value="${X.goal||''}" placeholder="None"></div></div></div>
 <div class="card"><b>Category limits (per month)</b>${X.cats.map(c=>`<div class="zd"><span>${em(c)} ${esc(c)}</span><input style="max-width:110px;text-align:right" data-k="cl" data-c="${esc(c)}" inputmode="decimal" value="${X.cl[c]||''}" placeholder="No limit"></div>`).join('')}</div>
 <div class="card"><b>Expense categories</b>${lst(X.cats,'cats')}<div class="zd"><input id="znccats" placeholder="New category"><button class="pb" data-m="ac" data-key="cats">Add</button></div></div>
 <div class="card"><b>Income sources</b>${lst(X.inc,'inc')}<div class="zd"><input id="zncinc" placeholder="New source"><button class="pb" data-m="ac" data-key="inc">Add</button></div></div>
 <div class="card"><b>Recurring expenses</b><br><small>Added automatically every month</small>${X.rec.map((r,i)=>`<div class="zd"><span>${esc(r.n)} · ৳${fmt(r.a)} · day ${r.day}<br><small>${esc(r.c)}</small></span><button class="x" data-m="dr" data-i="${i}">×</button></div>`).join('')}
 <div class="g2"><input id="zrn" placeholder="Name (e.g. Internet)"><input id="zra" inputmode="decimal" placeholder="Amount ৳"><select id="zrc">${X.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="zrdy" inputmode="numeric" placeholder="Day (1-28)"></div><button class="pb" data-m="ar" style="width:100%;margin-top:8px">Add recurring expense</button></div>
 <div class="card"><b>Export</b><small> · Backup &amp; restore: use the Backup tile on Home (includes this data)</small><div class="g2"><button data-m="exc">Export CSV</button><button data-m="rst" style="color:var(--rd)">Delete monthly data</button></div></div>`}
function render(){const lab=new Date(+mm.slice(0,4),+mm.slice(5)-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
 const tabs=[['ov','Overview'],['en','Entries'],['su','Summary'],['se','Settings']].map(([k,n])=>`<button class="chp ${tab==k?'sel':''}" data-m="tab" data-t="${k}">${n}</button>`).join('');
 $('v-mh').innerHTML=`<h2 style="margin-top:12px">Monthly Budget</h2><div class="dbar"><button data-m="mo" data-n="-1" aria-label="Previous month">‹</button><label class="dlab"><span>${lab}</span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><input type="month" id="zmp" value="${mm}"></label><button data-m="mo" data-n="1" aria-label="Next month">›</button></div><div style="margin:10px 0 12px">${tabs}</div>`+({ov,en,su,se})[tab]();
 const o=$('zop');if(o)o.onchange=e=>{const n=parseFloat(e.target.value);M(mm).open=isNaN(n)?null:n;sv();render()};
 if(tab=='en'){$('zhq').oninput=e=>{hq=e.target.value.toLowerCase();hl()};$('zhc').onchange=e=>{hc=e.target.value;hl()};hl()}}
function fillCats(sel){$('zsc').innerHTML=(ty=='e'?X.cats:X.inc).map(c=>`<option value="${esc(c)}" ${c==sel?'selected':''}>${em(c)} ${esc(c)}</option>`).join('')}
const tgl=()=>{$('zte').classList.toggle('sel',ty=='e');$('zti').classList.toggle('sel',ty=='i')};
function openSh(id,t){ed=id||null;const x=id&&(X.m[mm]||{tx:[]}).tx.find(v=>v.id==id),n=iso(new Date());ty=x?x.t:(t||'e');fillCats(x&&x.c);tgl();
 $('zsa').value=x?x.a:'';$('zsn').value=x?x.n:'';$('zsd').value=x?x.d:(n.slice(0,7)==mm?n:mm+'-01');$('zsdel').style.display=x?'block':'none';pos();$('zsh').classList.add('on');$('zscrim').classList.add('on');setTimeout(()=>$('zsa').focus({preventScroll:true}),60)}
const closeSh=()=>{$('zsh').classList.remove('on');$('zscrim').classList.remove('on')};
function saveSh(){const a=parseFloat($('zsa').value);if(!(a>0)){toast('Enter an amount');return}
 const d=$('zsd').value||iso(new Date()),k=d.slice(0,7);if(ed){const m=M(mm);m.tx=m.tx.filter(v=>v.id!=ed)}
 M(k).tx.push({id:ed||uid(),t:ty,a,c:$('zsc').value,n:$('zsn').value.trim(),d});sv();mm=k;closeSh();render();toast('Saved')}
function act(e){const el=e.target.closest('[data-m],[data-edit],[data-mty]');if(!el)return;const D=el.dataset,a=D.m,i=D.i;
 if(D.edit){openSh(D.edit);return}if(D.mty){ty=D.mty;fillCats();tgl();return}
 if(a=='mo'){mm=iso(new Date(+mm.slice(0,4),+mm.slice(5)-1+ +D.n,1)).slice(0,7);render()}
 else if(a=='tab'){tab=D.t;render()}else if(a=='add')openSh();else if(a=='inc')openSh(null,'i');else if(a=='cx')closeSh();else if(a=='ss')saveSh();
 else if(a=='sdel'&&confirm('Delete this entry?')){const m=M(mm);m.tx=m.tx.filter(v=>v.id!=ed);sv();closeSh();render()}
 else if(a=='dc'){X[D.key].splice(i,1);sv();render()}
 else if(a=='ac'){const v=$('znc'+D.key).value.trim();if(v){X[D.key].push(v);sv();render()}}
 else if(a=='ar'){const n=$('zrn').value.trim(),am=parseFloat($('zra').value),dy=parseInt($('zrdy').value)||1;if(!n||!(am>0)){toast('Enter name and amount');return}X.rec.push({id:uid(),n,a:am,c:$('zrc').value,day:Math.min(28,Math.max(1,dy))});sv();render()}
 else if(a=='dr'){X.rec.splice(i,1);sv();render()}
 else if(a=='exc'){let c='Date,Type,Category,Note,Amount\n';Object.keys(X.m).sort().forEach(k=>X.m[k].tx.forEach(x=>c+=`${x.d},${x.t=='e'?'Expense':'Income'},"${x.c}","${String(x.n).replace(/"/g,'""')}",${x.a}\n`));dl('monthly-budget.csv','\ufeff'+c,'text/csv')}
 else if(a=='rst'&&confirm('Delete ALL monthly budget data? Daily expense data is not affected.')){localStorage.removeItem(K2);location.reload()}}
[$('v-mh'),$('zsh'),$('zscrim')].forEach(el=>el.addEventListener('click',act));
$('v-mh').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(t.id=='zmp'){if(t.value){mm=t.value;render()}return}if(!k)return;const n=parseFloat(t.value);
 if(k=='open')M(mm).open=isNaN(n)?null:n;else if(k=='bud')X.bud=n||0;else if(k=='goal')X.goal=n||0;else if(k=='cl'){if(n>0)X.cl[t.dataset.c]=n;else delete X.cl[t.dataset.c]}sv()});
$('zsh').addEventListener('keydown',e=>{if(e.key=='Enter')saveSh()});
return{render,get:()=>X,set:s=>{X=s;sv()},tab:t=>{tab=t;render()},cur:()=>tab}})();
</script>
<script>
(()=>{const _show=show;let leaving=0;
const NM={today:'home',mh:'profile',hist:'hist',sum:'sum',set:'set'},VN={};Object.entries(NM).forEach(([k,v])=>VN[v]=k);
const parse=()=>{const h=location.hash.replace(/^#\/?/,'');if(h=='guard')return{g:1};if(h=='sheet')return{sh:1};const[a,b]=h.split('/');return{v:VN[a]||'today',t:b}};
const depth=()=>{const p=parse();return p.g||p.sh?0:(p.v!='today'?1:0)+(p.t?1:0)};
const go=(h,rep)=>rep?history.replaceState(null,'','#/'+h):(location.hash='/'+h);
show=function(v){if(v=='today'){const d=depth();if(view!='today'&&d>0){history.go(-d);return}_show(v);return}go(NM[v],view!='today');_show(v)};
$('v-mh').addEventListener('click',e=>{const b=e.target.closest('[data-m="tab"]');if(!b)return;const t=b.dataset.t,p=parse();
 if(t=='ov'){if(p.t){e.stopPropagation();history.back()}}else go('profile/'+t,!!p.t)},true);
const xm=document.createElement('div');xm.id='xm';xm.innerHTML='<div class="xb"><b>Exit app?</b><p class="mu">Do you want to close Pocket?</p><div class="g2"><button id="xc">Stay</button><button class="pb" id="xo">Exit</button></div></div>';document.body.appendChild(xm);
$('xc').onclick=()=>xm.classList.remove('on');
$('xo').onclick=()=>{xm.classList.remove('on');leaving=1;history.go(-1)};
const sync=()=>{const p=parse();
 if(p.g){if(leaving){try{window.close()}catch(e){}history.back();setTimeout(()=>{leaving=0;toast('Press back once more to exit')},500);return}xm.classList.add('on');location.hash='/home';return}
 if(p.sh)return;
 const op=document.querySelectorAll('#sh.on,#zsh.on');if(op.length){op.forEach(x=>x.classList.remove('on'));document.querySelectorAll('#scrim.on,#zscrim.on').forEach(x=>x.classList.remove('on'));if(document.activeElement)document.activeElement.blur()}
 xm.classList.remove('on');if(p.v!=view)_show(p.v);if(p.v=='mh'){const t=p.t||'ov';if(MH.cur()!=t)MH.tab(t)}};
addEventListener('hashchange',sync);
const ob=new MutationObserver(ms=>ms.forEach(m=>{if(m.target.classList.contains('on')){if(!parse().sh)location.hash='/sheet'}else if(parse().sh)history.back()}));
['sh','zsh'].forEach(id=>ob.observe($(id),{attributes:true,attributeFilter:['class']}));
let armed=0;const E=['pointerup','touchend','click','keydown'],arm=()=>{if(armed)return;armed=1;E.forEach(t=>removeEventListener(t,arm,true));if(location.hash!='#/home'){history.replaceState(null,'','#/guard');location.hash='/home'}};
E.forEach(t=>addEventListener(t,arm,true));if(navigator.userActivation&&navigator.userActivation.hasBeenActive)arm()})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
